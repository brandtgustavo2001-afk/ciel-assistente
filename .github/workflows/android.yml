name: Build and publish Ciel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ciel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Tests, lint and debug build
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.CIEL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ciel-signing.jks"
          chmod 600 "$RUNNER_TEMP/ciel-signing.jks"
      - name: Signed APK
        if: github.event_name != 'pull_request'
        env:
          CIEL_KEYSTORE_PATH: ${{ runner.temp }}/ciel-signing.jks
          CIEL_KEYSTORE_PASSWORD: ${{ secrets.CIEL_KEYSTORE_PASSWORD }}
          CIEL_KEY_ALIAS: ${{ secrets.CIEL_KEY_ALIAS }}
          CIEL_KEY_PASSWORD: ${{ secrets.CIEL_KEY_PASSWORD }}
        run: bash gradlew --no-daemon assembleRelease -PcielVersionCode="$VERSION_CODE" -PcielVersionName="$VERSION_NAME"
      - name: Verify and prepare release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p publish
          cp app/build/outputs/apk/release/app-release.apk publish/Ciel.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose publish/Ciel.apk
          python3 scripts/release_metadata.py publish/Ciel.apk "$VERSION_CODE" "$VERSION_NAME" publish/update.json
          cd publish && sha256sum Ciel.apk > SHA256SUMS.txt
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" publish/Ciel.apk publish/update.json publish/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Ciel $VERSION_NAME" --notes-file RELEASE_NOTES.md --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ciel-signing.jks"
